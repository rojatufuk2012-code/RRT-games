<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RRT ARCADE</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:#39ff14;
text-align:center;
}

.neon{
font-size:55px;
margin-top:15px;
text-shadow:0 0 10px #39ff14,0 0 25px #39ff14;
}

button{
padding:10px 14px;
margin:6px;
border-radius:10px;
cursor:pointer;
background:black;
color:#39ff14;
border:2px solid #39ff14;
}

button:hover{
background:#39ff14;
color:black;
}

.screen{display:none;}
.active{display:block;margin-top:15px;}

.win{font-size:22px;margin:10px;}

/* ADULT STYLE */
.adult{
color:gold;
}

.adult button{
border:2px solid gold;
color:gold;
box-shadow:0 0 12px gold;
}

.adult .neon{
text-shadow:0 0 25px gold;
}
</style>
</head>

<body>

<div class="neon">RRT ARCADE</div>

<!-- START -->
<div id="start" class="screen active">
<h2>MODE WÄHLEN</h2>
<button onclick="enter('kids')">🟢 KIDS MODE</button>
<button onclick="enter('adult')">🔥 ADULT MODE</button>
</div>

<!-- MENU -->
<div id="menu" class="screen">
<h2 id="title"></h2>

<div id="games"></div>

<br>
<button onclick="backStart()">EXIT</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
<h2 id="gtitle"></h2>

<div class="win" id="gout">READY</div>

<input id="inp" style="display:none">

<br>
<button onclick="startGame()">START</button>
<button onclick="back()">BACK</button>
</div>

<script>

let mode="";
let current="";
let secret=0;

/* MODE */
function enter(m){
mode=m;

document.body.className = (m==="adult")?"adult":"";

document.getElementById("start").classList.remove("active");
document.getElementById("menu").classList.add("active");

document.getElementById("title").innerText=
m==="kids"?"🟢 KIDS MODE":"🔥 ADULT MODE";

loadGames();
}

/* GAMES */
function loadGames(){

let g=document.getElementById("games");
g.innerHTML="";

if(mode==="kids"){
g.innerHTML=`
<button onclick="openGame('dice')">Dice</button>
<button onclick="openGame('guess')">Guess</button>
<button onclick="openGame('memory')">Memory</button>
<button onclick="openGame('click')">Click</button>
<button onclick="openGame('color')">Color</button>
<button onclick="openGame('reaction')">Reaction</button>
`;
}

if(mode==="adult"){
g.innerHTML=`
<button onclick="openGame('dice')">Dice Battle</button>
<button onclick="openGame('slot')">Slot</button>
<button onclick="openGame('highlow')">HighLow</button>
<button onclick="openGame('memory')">Memory+</button>
<button onclick="openGame('click')">Speed Click</button>
<button onclick="openGame('reaction')">Reaction Pro</button>
<button onclick="openGame('color')">Color Rush</button>
`;
}
}

/* OPEN GAME */
function openGame(g){
current=g;

document.getElementById("menu").classList.remove("active");
document.getElementById("game").classList.add("active");

document.getElementById("gtitle").innerText=g.toUpperCase();
document.getElementById("gout").innerText="READY";

document.getElementById("inp").style.display="none";

if(g==="guess"){
document.getElementById("inp").style.display="inline-block";
resetGuess();
}
}

/* BACK */
function back(){
document.getElementById("game").classList.remove("active");
document.getElementById("menu").classList.add("active");
}

function backStart(){
document.getElementById("menu").classList.remove("active");
document.getElementById("start").classList.add("active");
}

/* START */
function startGame(){

if(current==="dice") dice();
if(current==="slot") slot();
if(current==="guess") guess();
if(current==="memory") memory();
if(current==="click") click();
if(current==="reaction") reaction();
if(current==="color") color();
if(current==="highlow") highlow();
}

/* DICE */
let p=0,b=0;

function dice(){
p+=Math.floor(Math.random()*6)+1;
b+=Math.floor(Math.random()*6)+1;

document.getElementById("gout").innerText="YOU:"+p+" BOT:"+b;

if(p>=20&&p>b)document.getElementById("gout").innerText="YOU WIN";
if(b>=20&&b>p)document.getElementById("gout").innerText="YOU LOSE";
}

/* SLOT */
function slot(){

let s=["7","🍒","⭐","💎"];

let a=s[Math.random()*4|0];
let b=s[Math.random()*4|0];
let c=s[Math.random()*4|0];

document.getElementById("gout").innerText=a+" "+b+" "+c;

if(a===b&&b===c){
document.getElementById("gout").innerText="JACKPOT";
}else if(a===b||b===c||a===c){
document.getElementById("gout").innerText="WIN";
}else{
document.getElementById("gout").innerText="LOSE";
}
}

/* GUESS FIX */
function resetGuess(){
secret = mode==="adult"
?Math.floor(Math.random()*100)+1
:Math.floor(Math.random()*10)+1;
}

function guess(){
let v=Number(document.getElementById("inp").value);

if(!v)return;

if(v===secret){
document.getElementById("gout").innerText="CORRECT";
resetGuess();
}else{
document.getElementById("gout").innerText=
v>secret?"TOO HIGH":"TOO LOW";
}
}

/* MEMORY */
function memory(){
let n=Math.floor(Math.random()*900)+100;

document.getElementById("gout").innerText=n;

setTimeout(()=>{
document.getElementById("gout").innerText="???";
},1000);
}

/* CLICK */
let clicks=0;

function click(){
clicks++;
document.getElementById("gout").innerText="Clicks: "+clicks;
}

/* REACTION */
function reaction(){
document.getElementById("gout").innerText="WAIT...";

setTimeout(()=>{
document.getElementById("gout").innerText="CLICK!";
},900);
}

/* COLOR */
function color(){
document.getElementById("gout").innerText=
["red","green","blue","yellow"][Math.random()*4|0];
}

/* HIGHLOW */
function highlow(){
let n=Math.floor(Math.random()*100);
document.getElementById("gout").innerText="VS "+n;
}

</script>

</body>
</html>
