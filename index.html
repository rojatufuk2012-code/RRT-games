<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RRT-GAMES</title>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
  }

  button {
    padding: 12px 18px;
    margin: 6px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    transition: 0.2s;
  }

  button:hover {
    background: #00ff88;
    color: black;
  }

  .game {
    display: none;
    margin-top: 20px;
    opacity: 0;
    transition: 0.3s;
  }
</style>

</head>

<body>

<!-- MENU -->
<div id="menu">
  <h1>RRT-GAMES</h1>

  <p>Highscore (Survival Wave): <span id="hs">0</span></p>

  <button onclick="startDice()">Dice Game</button>
  <button onclick="startReaction()">Reaction Game</button>
  <button onclick="startBoss()">Boss Game</button>
  <button onclick="startSurvival()">Survival Mode</button>
</div>

<!-- DICE -->
<div id="diceGame" class="game">
  <h2>Dice Game</h2>

  <p id="d1">-</p>
  <p id="d2">-</p>
  <p id="score">Score: 0 | 0</p>

  <button onclick="rollDice()">Roll Dice</button>
  <button onclick="backMenu()">Back</button>
</div>

<!-- REACTION -->
<div id="reactionGame" class="game">
  <h2>Reaction Game</h2>

  <p id="reactionText">Drücke Start</p>

  <button onclick="startReactionTest()">Start</button>
  <button onclick="handleReactionClick()">CLICK</button>
  <button onclick="backMenu()">Back</button>
</div>

<!-- BOSS -->
<div id="bossGame" class="game">
  <h2>Boss Fight</h2>

  <p id="bossText">Fight!</p>
  <p id="bossHp">Boss HP: 0</p>
  <p id="playerHp">Deine HP: 0</p>

  <!-- HP BARS -->
  <div style="width:200px;height:15px;background:#333;margin:5px auto;">
    <div id="bossBar" style="height:100%;background:red;width:100%"></div>
  </div>

  <div style="width:200px;height:15px;background:#333;margin:5px auto;">
    <div id="playerBar" style="height:100%;background:lime;width:100%"></div>
  </div>

  <button onclick="attackBoss()">Attack</button>
  <button onclick="backMenu()">Back</button>
</div>

<script>

/* HIGH SCORE */
let highscore = localStorage.getItem("highscore") || 0;
document.getElementById("hs").innerText = highscore;

/* DICE */
let player = 0;
let cpu = 0;

/* BOSS / SURVIVAL */
let bossHp = 50;
let playerHp = 30;
let level = 1;
let wave = 1;

/* REACTION */
let startTime = 0;
let reactionActive = false;

/* MENU */
function showGame(id){
  document.getElementById("menu").style.display = "none";
  document.querySelectorAll(".game").forEach(g => g.style.display = "none");

  const game = document.getElementById(id);
  game.style.display = "block";

  setTimeout(() => {
    game.style.opacity = 1;
  }, 50);
}

function backMenu(){
  document.querySelectorAll(".game").forEach(g => {
    g.style.display = "none";
    g.style.opacity = 0;
  });

  document.getElementById("menu").style.display = "block";
}

/* START */
function startDice(){ showGame("diceGame"); }
function startReaction(){ showGame("reactionGame"); }
function startBoss(){ showGame("bossGame"); startWave(); }
function startSurvival(){ showGame("bossGame"); wave = 1; startWave(); }

/* DICE */
function rollDice(){
  const d1 = Math.floor(Math.random()*6)+1;
  const d2 = Math.floor(Math.random()*6)+1;

  player += d1;
  cpu += d2;

  document.getElementById("d1").innerText = "DU: " + d1;
  document.getElementById("d2").innerText = "CPU: " + d2;

  document.getElementById("score").innerText =
    "Score: " + player + " | " + cpu;

  if(player >= 20){
    alert("DU GEWINNST!");
    resetDice();
  }

  if(cpu >= 20){
    alert("CPU GEWINNT!");
    resetDice();
  }
}

function resetDice(){
  player = 0;
  cpu = 0;
  document.getElementById("score").innerText = "Score: 0 | 0";
}

/* REACTION */
function startReactionTest(){
  if(reactionActive) return;

  reactionActive = true;
  startTime = 0;

  document.getElementById("reactionText").innerText = "Warte...";

  const delay = Math.random()*3000 + 2000;

  setTimeout(() => {
    if(!reactionActive) return;

    document.getElementById("reactionText").innerText = "JETZT!";
    startTime = Date.now();
  }, delay);
}

function handleReactionClick(){

  if(!reactionActive){
    document.getElementById("reactionText").innerText = "Zu früh!";
    return;
  }

  if(startTime === 0) return;

  const reaction = Date.now() - startTime;

  document.getElementById("reactionText").innerText =
    "Zeit: " + reaction + " ms";

  reactionActive = false;
  startTime = 0;
}

/* SURVIVAL / BOSS */
function startWave(){
  bossHp = 40 + wave * 15;
  playerHp = 30;

  document.getElementById("bossText").innerText =
    "WAVE " + wave;

  updateUI();
}

function attackBoss(){

  const crit = Math.random() < 0.2 ? 2 : 1;
  const playerDmg = (Math.floor(Math.random()*6)+1) * crit;
  const bossDmg = Math.floor(Math.random()*5)+1;

  bossHp -= playerDmg;
  playerHp -= bossDmg;

  updateUI();

  if(bossHp <= 0){
    wave++;

    if(wave > highscore){
      highscore = wave;
      localStorage.setItem("highscore", highscore);
      document.getElementById("hs").innerText = highscore;
    }

    setTimeout(startWave, 700);
  }

  if(playerHp <= 0){
    alert("VERLOREN!");
    backMenu();
  }
}

function updateUI(){

  document.getElementById("bossHp").innerText = "Boss HP: " + bossHp;
  document.getElementById("playerHp").innerText = "Deine HP: " + playerHp;

  let bossMax = 40 + wave * 15;

  document.getElementById("bossBar").style.width =
    (bossHp / bossMax) * 100 + "%";

  document.getElementById("playerBar").style.width =
    (playerHp / 30) * 100 + "%";
}

</script>

</body>
</html>
