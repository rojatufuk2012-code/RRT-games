<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RRT-GAMES</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:black;
    color:#39ff14;
    text-align:center;
}

.neon{
    font-size:55px;
    margin-top:20px;
    text-shadow:0 0 10px #39ff14,0 0 25px #39ff14;
}

button{
    padding:10px 16px;
    margin:6px;
    border:2px solid #39ff14;
    background:black;
    color:#39ff14;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 0 10px #39ff14;
}

button:hover{
    background:#39ff14;
    color:black;
}

.screen{display:none;margin-top:15px;}
.active{display:block;}

.win{
    font-size:30px;
    min-height:40px;
}

.click{font-size:18px;margin:10px;}

.row{display:flex;justify-content:center;gap:10px;}
</style>
</head>

<body>

<div class="neon">RRT-GAMES</div>

<!-- MODE -->
<div id="start" class="screen active">
    <h2>SERVER AUSWAHL</h2>

    <button onclick="enter('kids')">KIDS MODE 🟢</button>
    <button onclick="enter('adult')">ADULT MODE 🔥</button>
</div>

<!-- MENU -->
<div id="menu" class="screen">
    <h2 id="title">MENU</h2>

    <button onclick="openGame('dice')">Dice Game</button>
    <button onclick="openGame('reaction')">Reaction Game</button>
    <button onclick="openGame('guess')">Guess Game</button>
    <button onclick="openGame('clickrush')">Click Rush</button>
    <button onclick="openGame('memory')">Memory Game</button>

    <br>
    <button onclick="backStart()">Back</button>
</div>

<!-- DICE -->
<div id="dice" class="screen">
    <h2>Dice Game</h2>
    <p>Du: <span id="p">0</span> | Bot: <span id="b">0</span></p>
    <div class="win" id="diceWin"></div>
    <button onclick="roll()">Roll</button>
    <button onclick="back()">Back</button>
</div>

<!-- REACTION -->
<div id="reaction" class="screen">
    <h2>Reaction Game</h2>
    <div class="click">CLICK IMMER SICHTBAR</div>
    <p id="txt">Start</p>
    <div class="win" id="reactWin"></div>
    <button id="startBtn" onclick="startR()">Start</button>
    <button id="clickBtn" onclick="clickR()" style="display:none;">CLICK</button>
    <button onclick="back()">Back</button>
</div>

<!-- GUESS -->
<div id="guess" class="screen">
    <h2>Guess Game</h2>
    <div class="win" id="guessWin"></div>
    <input id="inp" type="number" min="1" max="10">
    <br><br>
    <button onclick="guess()">Check</button>
    <button onclick="back()">Back</button>
</div>

<!-- NEW GAME 1: CLICK RUSH -->
<div id="clickrush" class="screen">
    <h2>Click Rush</h2>

    <div class="win" id="crTime">0</div>
    <button onclick="startCR()">START</button>
    <button onclick="clickCR()">CLICK</button>

    <div class="win" id="crResult"></div>
    <button onclick="back()">Back</button>
</div>

<!-- NEW GAME 2: MEMORY SEQUENCE -->
<div id="memory" class="screen">
    <h2>Memory Game</h2>

    <div class="win" id="seq"></div>

    <input id="memInp" placeholder="Zahl eingeben">
    <br><br>

    <button onclick="checkMem()">Check</button>
    <button onclick="back()">Back</button>

    <div class="win" id="memRes"></div>
</div>

<script>

let mode="kids";

/* MODE */
function enter(m){
    mode=m;
    document.getElementById("start").classList.remove("active");
    document.getElementById("menu").classList.add("active");

    document.getElementById("title").innerText =
        m==="kids" ? "KIDS MODE 🟢 (EASY)" : "ADULT MODE 🔥 (HARD)";
}

/* NAV */
function openGame(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    if(id==="memory") startMemory();
}

function back(){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('menu').classList.add('active');
}

function backStart(){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('start').classList.add('active');
}

/* ---------------- 3 BASIC GAMES ---------------- */

/* DICE */
let p=0,b=0;

function roll(){
    let m = mode==="adult"?2:1;

    p += (Math.random()*6|0)+1*m;
    b += (Math.random()*6|0)+1*m;

    document.getElementById("p").innerText=p;
    document.getElementById("b").innerText=b;

    if(p>=20 && p>b) document.getElementById("diceWin").innerText="YOU WIN";
    if(b>=20 && b>p) document.getElementById("diceWin").innerText="YOU LOSE";
}

/* RESET DICE */
document.querySelector('[onclick="openGame(\'dice\')"]').addEventListener("click",()=>{
    p=0;b=0;
    document.getElementById("p").innerText=0;
    document.getElementById("b").innerText=0;
    document.getElementById("diceWin").innerText="";
});

/* REACTION */
let ready=false,t;

function startR(){
    document.getElementById("txt").innerText="Warten...";
    document.getElementById("startBtn").style.display="none";

    let delay = mode==="adult"?1500:2500;

    setTimeout(()=>{
        document.getElementById("txt").innerText="JETZT!";
        document.getElementById("clickBtn").style.display="inline-block";
        ready=true;
        t=Date.now();
    },Math.random()*delay+800);
}

function clickR(){
    if(!ready)return;
    let time=Date.now()-t;

    document.getElementById("reactWin").innerText="Zeit: "+time+" ms";

    ready=false;
    document.getElementById("clickBtn").style.display="none";
    document.getElementById("startBtn").style.display="inline-block";
}

/* GUESS */
let secret=Math.floor(Math.random()*10)+1;

function guess(){
    let v=Number(document.getElementById("inp").value);

    if(v===secret){
        document.getElementById("guessWin").innerText="RICHTIG!";
        secret=Math.floor(Math.random()*10)+1;
    }else{
        document.getElementById("guessWin").innerText =
            v>secret?"Zu hoch":"Zu niedrig";
    }
}

/* ---------------- NEW GAME 1: CLICK RUSH ---------------- */
let crStart;

function startCR(){
    crStart=Date.now();
    document.getElementById("crResult").innerText="";
}

function clickCR(){
    let t=Date.now()-crStart;
    let limit=mode==="adult"?400:700;

    document.getElementById("crResult").innerText =
        t<limit?"FAST WIN":"TOO SLOW";
}

/* ---------------- NEW GAME 2: MEMORY SEQ ---------------- */
let seqNum;

function startMemory(){
    seqNum = Math.floor(Math.random()*900)+100;

    document.getElementById("seq").innerText=seqNum;

    setTimeout(()=>{
        document.getElementById("seq").innerText="???";
    }, mode==="adult"?800:1500);
}

function checkMem(){
    let v=document.getElementById("memInp").value;

    document.getElementById("memRes").innerText =
        v==seqNum?"RIGHT":"WRONG";
}

</script>

</body>
</html>
