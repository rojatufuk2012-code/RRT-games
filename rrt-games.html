<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RRT-GAMES</title>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
  }

  button {
    padding: 10px 15px;
    margin: 5px;
    cursor: pointer;
  }

  .game {
    display: none;
    margin-top: 20px;
  }
</style>

</head>

<body>

<!-- MENU -->
<div id="menu">
  <h1>RRT-GAMES</h1>

  <button onclick="startDice()">Dice Game</button>
  <button onclick="startReaction()">Reaction Game</button>
  <button onclick="startBoss()">Boss Game</button>
</div>

<!-- DICE GAME -->
<div id="diceGame" class="game">
  <h2>Dice Game</h2>

  <p id="d1">-</p>
  <p id="d2">-</p>
  <p id="score">Score: 0 | 0</p>

  <button onclick="rollDice()">Roll Dice</button>
  <button onclick="backMenu()">Back</button>
</div>

<!-- REACTION GAME -->
<div id="reactionGame" class="game">
  <h2>Reaction Game</h2>

  <p id="reactionText">Drücke Start</p>

  <button onclick="startReactionTest()">Start</button>
  <button onclick="handleReactionClick()">CLICK</button>
  <button onclick="backMenu()">Back</button>
</div>

<!-- BOSS GAME -->
<div id="bossGame" class="game">
  <h2>Boss Fight</h2>

  <p id="bossText">Der Boss erscheint...</p>
  <p id="bossHp">Boss HP: 50</p>
  <p id="playerHp">Deine HP: 30</p>

  <button onclick="attackBoss()">Attack</button>
  <button onclick="backMenu()">Back</button>
</div>

<script>

let player = 0;
let cpu = 0;

let bossHp = 50;
let playerHp = 30;

/* MENU */
function showGame(id){
  document.getElementById("menu").style.display = "none";
  document.querySelectorAll(".game").forEach(g => g.style.display = "none");
  document.getElementById(id).style.display = "block";
}

function backMenu(){
  document.querySelectorAll(".game").forEach(g => g.style.display = "none");
  document.getElementById("menu").style.display = "block";
}

/* STARTS */
function startDice(){ showGame("diceGame"); }
function startReaction(){ showGame("reactionGame"); }
function startBoss(){ showGame("bossGame"); resetBoss(); }

/* DICE */
function rollDice(){

  const d1 = Math.floor(Math.random()*6)+1;
  const d2 = Math.floor(Math.random()*6)+1;

  player += d1;
  cpu += d2;

  document.getElementById("d1").innerText = "DU: " + d1;
  document.getElementById("d2").innerText = "CPU: " + d2;

  document.getElementById("score").innerText =
    "Score: " + player + " | " + cpu;

  if(player >= 20){
    alert("DU GEWINNST!");
    resetDice();
  }

  if(cpu >= 20){
    alert("CPU GEWINNT!");
    resetDice();
  }
}

function resetDice(){
  player = 0;
  cpu = 0;

  document.getElementById("d1").innerText = "-";
  document.getElementById("d2").innerText = "-";
  document.getElementById("score").innerText = "Score: 0 | 0";
}

/* REACTION */
let startTime = 0;
let reactionActive = false;

function startReactionTest(){

  if(reactionActive) return;

  reactionActive = true;

  document.getElementById("reactionText").innerText =
    "Warte auf GRÜN...";

  const delay = Math.random()*3000 + 2000;

  setTimeout(() => {
    document.getElementById("reactionText").innerText =
      "JETZT KLICKEN!";
    startTime = Date.now();
  }, delay);
}

function handleReactionClick(){

  if(!reactionActive || startTime === 0) return;

  const reaction = Date.now() - startTime;

  document.getElementById("reactionText").innerText =
    "Zeit: " + reaction + " ms";

  startTime = 0;
  reactionActive = false;
}

/* BOSS */
function resetBoss(){
  bossHp = 50;
  playerHp = 30;
  updateBossUI();
  document.getElementById("bossText").innerText = "Der Boss erscheint...";
}

function updateBossUI(){
  document.getElementById("bossHp").innerText = "Boss HP: " + bossHp;
  document.getElementById("playerHp").innerText = "Deine HP: " + playerHp;
}

function attackBoss(){

  if(bossHp <= 0 || playerHp <= 0) return;

  const playerDmg = Math.floor(Math.random()*6)+1;
  const bossDmg = Math.floor(Math.random()*5)+1;

  bossHp -= playerDmg;
  playerHp -= bossDmg;

  updateBossUI();

  document.getElementById("bossText").innerText =
    "Du: -" + playerDmg + " | Boss: -" + bossDmg;

  checkBoss();
}

function checkBoss(){

  if(bossHp <= 0){
    alert("DU HAST GEWONNEN!");
    resetBoss();
    backMenu();
  }

  if(playerHp <= 0){
    alert("DU VERLOREN!");
    resetBoss();
    backMenu();
  }
}

</script>

</body>
</html>
